<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image to URI - Nc0d3Tools</title>
  <style>
    :root {
      --verde-botella: #07291e;
      --verde-botella-light: #0d3b2c;
      --verde-esmeralda: #10b981;
      --verde-esmeralda-glow: #34d399;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    body {
      background-color: var(--verde-botella);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .main-header {
      background: rgba(7, 41, 30, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(16, 185, 129, 0.2);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left { display: flex; align-items: center; gap: 1.5rem; }

    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--verde-botella-light); border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--verde-esmeralda); cursor: pointer; transition: all 0.3s ease; text-decoration: none;
    }
    .back-btn:hover { background: rgba(16, 185, 129, 0.1); transform: scale(1.05); }

    .logo { font-size: 1.4rem; font-weight: 800; color: #ffffff; }
    .logo span { color: var(--verde-esmeralda); }

    /* Contenedor Principal Grid 2 Columnas */
    .tool-container {
      max-width: 1200px; margin: 2rem auto; padding: 0 2rem;
      display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
      flex: 1; width: 100%; min-height: 600px;
    }
    @media (max-width: 768px) { .tool-container { grid-template-columns: 1fr; } }

    /* IZQUIERDA: 3 Filas */
    .input-column { display: grid; grid-template-rows: repeat(3, 1fr); gap: 1.5rem; }
    
    .input-card {
      background: var(--verde-botella-light); border: 1px dashed rgba(16, 185, 129, 0.4);
      border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem; text-align: center; transition: all 0.3s ease; position: relative;
    }
    .input-card:hover, .input-card.active-drag { border-color: var(--verde-esmeralda); background: rgba(16, 185, 129, 0.05); }
    .icon-box { width: 48px; height: 48px; margin-bottom: 1rem; color: var(--verde-esmeralda); }
    .input-card h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #fff; }
    .input-card p { font-size: 0.85rem; color: var(--text-muted); }

    #file-input { display: none; }
    .upload-label { cursor: pointer; position: absolute; inset: 0; }

    .url-wrapper { display: flex; width: 100%; max-width: 300px; margin-top: 1rem; border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 8px; overflow: hidden; }
    .url-wrapper input { flex: 1; padding: 0.5rem 1rem; border: none; background: rgba(0,0,0,0.2); color: #fff; outline: none; }
    .url-wrapper button { padding: 0 1rem; border: none; background: var(--verde-esmeralda); color: var(--verde-botella); font-weight: bold; cursor: pointer; transition: 0.2s; }
    .url-wrapper button:hover { background: var(--verde-esmeralda-glow); }

    /* DERECHA: 2 Filas (Textarea y Vista Previa) */
    .output-column { display: grid; grid-template-rows: 1fr 1fr; gap: 1.5rem; }
    
    .output-section {
      background: var(--verde-botella-light); border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
    }

    .output-header { display: flex; justify-content: space-between; align-items: center; }
    .output-header h2 { font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 0.5rem; }
    .header-icon { width: 20px; height: 20px; color: var(--verde-esmeralda); }

    .copy-btn {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.8rem;
      background: rgba(0,0,0,0.2); border: 1px solid var(--verde-esmeralda); color: var(--verde-esmeralda);
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.3s ease;
    }
    .copy-btn:hover { background: var(--verde-esmeralda); color: var(--verde-botella); }
    .copy-btn svg { width: 16px; height: 16px; }

    textarea {
      flex: 1; width: 100%; padding: 1rem; border-radius: 8px; border: 1px dashed rgba(16, 185, 129, 0.3);
      background: rgba(0, 0, 0, 0.2); color: var(--verde-esmeralda-glow); font-family: monospace;
      font-size: 0.85rem; resize: none; outline: none; line-height: 1.5; word-break: break-all;
    }
    textarea:focus { border-color: var(--verde-esmeralda); border-style: solid; }

    /* Caja de la Imagen Renderizada */
    .preview-box {
      flex: 1; width: 100%; border-radius: 8px; border: 1px dashed rgba(16, 185, 129, 0.3);
      background: rgba(0, 0, 0, 0.2); display: flex; align-items: center; justify-content: center;
      overflow: hidden; padding: 0.5rem; position: relative;
    }
    
    .preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; border-radius: 4px; }
    
    .placeholder-text { color: var(--text-muted); font-size: 0.9rem; font-style: italic; display: flex; flex-direction: column; align-items: center; gap: 0.5rem;}
    .placeholder-text svg { width: 32px; height: 32px; opacity: 0.5; }

  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-left">
      <a href="../../index.html" class="back-btn" title="Volver al Hub">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 class="logo">Nc0d3<span>Tools</span></h1>
    </div>
  </header>

  <main class="tool-container">
    
    <!-- COLUMNA IZQUIERDA -->
    <div class="input-column">
      <div class="input-card" id="drop-zone">
        <svg class="icon-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h3>Subir desde tu PC</h3>
        <p>Arrastra tu imagen o haz clic aquí</p>
        <label class="upload-label"><input type="file" id="file-input" accept="image/*" /></label>
      </div>

      <div class="input-card">
        <svg class="icon-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h3>Pegar URL</h3>
        <p>Convierte una imagen desde la web</p>
        <div class="url-wrapper">
          <input type="text" id="url-input" placeholder="https://ejemplo.com/img.png" autocomplete="off" />
          <button id="url-btn">Traer</button>
        </div>
      </div>

      <div class="input-card" id="clipboard-zone">
        <svg class="icon-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <h3>Ctrl + V</h3>
        <p>Pega una imagen directamente desde tu portapapeles</p>
      </div>
    </div>

    <!-- COLUMNA DERECHA -->
    <div class="output-column">
      
      <!-- Fila 1: Código -->
      <div class="output-section">
        <div class="output-header">
          <h2><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg> Código Base64</h2>
          <button class="copy-btn" id="copy-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-linejoin="round"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="copy-text">Copiar</span>
          </button>
        </div>
        <textarea id="result-box" placeholder="Tu Data URI aparecerá aquí..." readonly></textarea>
      </div>

      <!-- Fila 2: Vista Previa -->
      <div class="output-section">
        <div class="output-header">
          <h2><svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg> Vista Previa</h2>
        </div>
        <div class="preview-box">
          <img id="preview-img" src="" alt="Vista previa de la imagen renderizada" />
          <div class="placeholder-text" id="preview-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span>Esperando imagen...</span>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script type="module">
    import { fileToDataUri, urlToDataUri } from './img2uri.js';

    const resultBox = document.getElementById('result-box');
    const previewImg = document.getElementById('preview-img');
    const previewPlaceholder = document.getElementById('preview-placeholder');
    const copyBtn = document.getElementById('copy-btn');
    const copyText = document.getElementById('copy-text');
    
    // Función central para gestionar el estado visual completo
    function updateUI(status, payload) {
      if (status === 'loading') {
        resultBox.value = `Procesando: ${payload}...`;
        previewImg.style.display = 'none';
        previewPlaceholder.style.display = 'flex';
        previewPlaceholder.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span>Cargando...</span>`;
      } 
      else if (status === 'error') {
        resultBox.value = `Error: ${payload}`;
        previewImg.style.display = 'none';
        previewPlaceholder.style.display = 'flex';
        previewPlaceholder.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><span style="color:#ef4444;">Sin imagen</span>`;
      } 
      else if (status === 'success') {
        resultBox.value = payload;
        previewImg.src = payload;
        previewImg.style.display = 'block';
        previewPlaceholder.style.display = 'none';
      }
    }

    // --- 1. PC (Archivo) ---
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');

    fileInput.addEventListener('change', async (e) => {
      if (e.target.files.length > 0) {
        updateUI('loading', 'imagen local');
        try {
          const uri = await fileToDataUri(e.target.files[0]);
          updateUI('success', uri);
        } catch (err) { updateUI('error', 'No se pudo procesar la imagen.'); }
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault(); dropZone.classList.add('active-drag');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('active-drag'));
    dropZone.addEventListener('drop', async (e) => {
      e.preventDefault(); dropZone.classList.remove('active-drag');
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
          updateUI('loading', 'imagen arrastrada');
          try {
            const uri = await fileToDataUri(file);
            updateUI('success', uri);
          } catch (err) { updateUI('error', 'Fallo al generar base64.'); }
        } else {
          updateUI('error', 'El archivo no es una imagen soportada.');
        }
      }
    });

    // --- 2. URL ---
    const urlBtn = document.getElementById('url-btn');
    const urlInput = document.getElementById('url-input');

    urlBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      updateUI('loading', 'descargando desde URL');
      try {
        const uri = await urlToDataUri(url);
        updateUI('success', uri);
      } catch (err) {
        updateUI('error', 'Fallo por CORS o URL inválida. Intenta pegando directamente.');
      }
    });

    // --- 3. Ctrl+V (Portapapeles) ---
    const clipboardZone = document.getElementById('clipboard-zone');
    
    window.addEventListener('paste', async (e) => {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      let foundImage = false;

      for (const item of items) {
        if (item.type.indexOf('image/') === 0) {
          foundImage = true;
          const file = item.getAsFile();
          
          clipboardZone.classList.add('active-drag');
          updateUI('loading', 'imagen del portapapeles');
          
          try {
            const uri = await fileToDataUri(file);
            updateUI('success', uri);
          } catch (err) {
            updateUI('error', 'Falló lectura del portapapeles.');
          }

          setTimeout(() => clipboardZone.classList.remove('active-drag'), 300);
          break;
        }
      }
      if (!foundImage && e.target === document.body) {
        updateUI('error', 'No se detectó ninguna imagen en tu Ctrl+V.');
      }
    });

    // --- 4. Copiar ---
    copyBtn.addEventListener('click', () => {
      const val = resultBox.value;
      if (!val || val.startsWith('Error') || val.startsWith('Procesando')) return;

      navigator.clipboard.writeText(val).then(() => {
        copyText.textContent = '¡Copiado!';
        copyBtn.style.background = 'var(--verde-esmeralda)';
        copyBtn.style.color = 'var(--verde-botella)';
        
        setTimeout(() => {
          copyText.textContent = 'Copiar';
          copyBtn.style.background = 'rgba(0,0,0,0.2)';
          copyBtn.style.color = 'var(--verde-esmeralda)';
        }, 2000);
      }).catch(() => {
        updateUI('error', 'Permisos de portapapeles denegados.');
      });
    });
  </script>
</body>
</html>
