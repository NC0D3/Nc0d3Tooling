<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept Doc Editor - Nc0d3Tools</title>
  <style>
    :root {
      --verde-botella: #07291e;
      --verde-botella-light: #0d3b2c;
      --verde-esmeralda: #10b981;
      --verde-esmeralda-glow: #34d399;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }

    body {
      background-color: var(--verde-botella);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .main-header {
      background: rgba(7, 41, 30, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(16, 185, 129, 0.2);
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 10;
    }
    .header-left { display: flex; align-items: center; gap: 1.5rem; }
    .back-btn {
      display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%; background: var(--verde-botella-light);
      border: 1px solid rgba(16, 185, 129, 0.3); color: var(--verde-esmeralda);
      cursor: pointer; transition: all 0.3s ease; text-decoration: none;
    }
    .back-btn:hover { background: rgba(16, 185, 129, 0.1); transform: scale(1.05); }
    .logo { font-size: 1.4rem; font-weight: 800; color: #ffffff; }
    .logo span { color: var(--verde-esmeralda); }

    /* Layout Principal */
    .editor-container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }
    
    .form-card {
      background: var(--verde-botella-light); border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
    }

    .form-card h3 { font-size: 1.1rem; color: var(--verde-esmeralda); margin-bottom: 0.5rem; border-bottom: 1px solid rgba(16,185,129,0.2); padding-bottom: 0.5rem;}
    
    /* Inputs */
    .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
    input[type="text"] {
      width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid rgba(16, 185, 129, 0.3);
      background: rgba(0, 0, 0, 0.2); color: #fff; font-size: 1rem; outline: none; transition: border 0.3s;
    }
    input[type="text"]:focus, textarea:focus { border-color: var(--verde-esmeralda); }

    /* Rich Text Area */
    .rt-toolbar { display: flex; gap: 0.5rem; background: rgba(0,0,0,0.3); padding: 0.5rem; border-radius: 6px 6px 0 0; border: 1px solid rgba(16, 185, 129, 0.3); border-bottom: none; }
    .rt-btn { background: var(--verde-botella-light); border: 1px solid rgba(16, 185, 129, 0.5); color: var(--text-main); border-radius: 4px; padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer; transition: 0.2s; font-weight: bold; }
    .rt-btn:hover { background: var(--verde-esmeralda); color: var(--verde-botella); }
    textarea {
      width: 100%; height: 120px; padding: 0.8rem; border-radius: 0 0 6px 6px; border: 1px solid rgba(16, 185, 129, 0.3);
      background: rgba(0, 0, 0, 0.2); color: #fff; font-size: 0.95rem; resize: vertical; outline: none; font-family: monospace;
    }

    /* Evidencia Visual Dropzone */
    .drop-zone {
      border: 2px dashed rgba(16, 185, 129, 0.4); border-radius: 8px; padding: 2rem;
      text-align: center; cursor: pointer; transition: all 0.3s; background: rgba(0,0,0,0.1);
    }
    .drop-zone.active { border-color: var(--verde-esmeralda); background: rgba(16,185,129,0.05); }
    .drop-zone p { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem; }
    
    .gallery { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 1rem; }
    .img-preview { width: 100px; height: 100px; border-radius: 6px; object-fit: cover; border: 1px solid var(--verde-esmeralda); }
    .img-wrapper { position: relative; display: inline-block; }
    .remove-img { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-weight: bold; font-size: 12px; }

    /* Footer / Submit */
    .actions { display: flex; justify-content: flex-end; padding: 1rem 0 3rem 0; }
    .submit-btn {
      padding: 1rem 2rem; font-size: 1.1rem; font-weight: bold; color: var(--verde-botella);
      background: var(--verde-esmeralda); border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;
    }
    .submit-btn:hover { background: var(--verde-esmeralda-glow); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(16,185,129,0.3); }

  </style>
</head>
<body>

  <header class="main-header">
    <div class="header-left">
      <a href="../../index.html" class="back-btn" title="Volver al Hub">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <h1 class="logo">Nc0d3<span>ConceptDoc</span></h1>
    </div>
  </header>

  <main class="editor-container">
    
    <!-- Metadatos -->
    <div class="form-card">
      <h3>1. Metadatos Principales</h3>
      <div class="input-group">
        <label>ID de la Persona (Author ID)</label>
        <input type="text" id="field-author" placeholder="Ej. 1212121212" />
      </div>
      <div class="input-group">
        <label>Nombre de la Idea (Title)</label>
        <input type="text" id="field-title" placeholder="Ej. Dummy data generator" />
      </div>
    </div>

    <!-- Campos de Texto con Markdown -->
    <div class="form-card" id="text-fields-container">
      <h3>2. Contenido del Documento</h3>
      <!-- Se inyectarán dinámicamente desde JS para no repetir HTML -->
    </div>

    <!-- Evidencia Visual -->
    <div class="form-card">
      <h3>3. Evidencia Visual</h3>
      <div class="drop-zone" id="drop-zone">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--verde-esmeralda)" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <p>Arrastra imágenes aquí, pégalas (Ctrl+V) o haz clic para subir</p>
        <input type="file" id="file-input" accept="image/*" multiple style="display:none" />
      </div>
      <div class="gallery" id="gallery"></div>
    </div>

    <!-- Acciones -->
    <div class="actions">
      <button class="submit-btn" id="generate-btn">Generar Documento Markdown</button>
    </div>

  </main>

  <script type="module" src="concept_doc.js"></script>
</body>
</html>
